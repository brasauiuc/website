<li class="cell board-card">
  {{#image}}<img class="avatar" src="{{BASE}}/{{image}}" width="120" height="120" loading="lazy" alt="Portrait of {{name}}">{{/image}}
  {{^image}}<div class="avatar" aria-hidden="true">{{initials}}</div>{{/image}}
  <h2 class="text-[22px]/tight">{{name}}</h2>
  <p class="board-role">{{role}}</p>
  <p class="board-major">{{major}}</p>
  {{#class_text}}<p class="board-class">{{class_text}}</p>{{/class_text}}
</li>
