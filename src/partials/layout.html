<!doctype html>
<html lang="{{LANG}}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{TITLE}}</title>
  <meta name="description" content="{{DESCRIPTION}}">
  <meta name="theme-color" content="#0b1a12">
  <link rel="canonical" href="{{SITE_URL}}{{PAGE_PATH}}">
  <link rel="alternate" hreflang="en" href="{{SITE_URL}}{{ENGLISH_PATH}}">
  <link rel="alternate" hreflang="pt-BR" href="{{SITE_URL}}{{PORTUGUESE_PATH}}">
  <link rel="alternate" hreflang="x-default" href="{{SITE_URL}}{{ENGLISH_PATH}}">

  <meta property="og:type" content="website">
  <meta property="og:locale" content="{{OG_LOCALE}}">
  <meta property="og:site_name" content="BRASA at UIUC">
  <meta property="og:title" content="{{TITLE}}">
  <meta property="og:description" content="{{DESCRIPTION}}">
  <meta property="og:url" content="{{SITE_URL}}{{PAGE_PATH}}">
  <meta property="og:image" content="{{SITE_URL}}/assets/og-image.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="BRASA at UIUC">
  <meta name="twitter:card" content="summary_large_image">

  <link rel="icon" type="image/png" sizes="32x32" href="{{BASE}}/assets/favicon-32.png">
  <link rel="apple-touch-icon" href="{{BASE}}/assets/apple-touch-icon.png">
  <link rel="preload" href="{{BASE}}/assets/fonts/manrope-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="{{BASE}}/assets/fonts/fraunces-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="{{BASE}}/assets/site.css">
</head>
<body>
{{> header}}
<main id="main">
{{CONTENT}}
</main>
{{> footer}}
</body>
</html>
