<!--
  HOME PAGE HERO IMAGE. To swap it: overwrite the four files in src/assets/hero/ keeping
  the same names, then update the [hero] text in src/site.toml (README.md, "Swap the hero image").
  To remove it: delete the img tag. The hero falls back to a plain dark background.
-->
<img
  src="{{BASE}}/assets/hero/hero-1600.webp"
  srcset="{{BASE}}/assets/hero/hero-640.webp 640w,
          {{BASE}}/assets/hero/hero-1024.webp 1024w,
          {{BASE}}/assets/hero/hero-1600.webp 1600w,
          {{BASE}}/assets/hero/hero-2172.webp 2172w"
  sizes="(min-width: 80rem) max(100vw, 2280px), max(100vw, 156vh)"
  width="2172" height="724"
  fetchpriority="high"
  alt="{{HERO_ALT}}">
