<li class="cell">
  {{#photo}}<img class="avatar" src="{{BASE}}/assets/board/{{photo}}" width="96" height="96" loading="lazy" alt="Retrato de {{plain_name}}">{{/photo}}
  {{^photo}}<div class="avatar" aria-hidden="true">{{initials}}</div>{{/photo}}
  <h2 class="text-[22px]/tight">{{name}}</h2>
  <p>{{role}}</p>
  <p class="mt-1!">{{major}}</p>
  {{#linkedin}}<p><a class="link" href="{{linkedin}}" aria-label="LinkedIn de {{plain_name}}">LinkedIn</a></p>{{/linkedin}}
</li>
