<article class="event">
  {{#image}}<img class="event-image" src="{{BASE}}/{{image}}" loading="lazy" alt="Imagem de {{title}}">{{/image}}
  <div>
    <p class="row-key">{{when}}</p>
    <h3 class="mt-1">{{title}}</h3>
    {{#description}}<p class="event-text">{{description}}</p>{{/description}}
    {{#location}}<p class="row-note">{{location}}</p>{{/location}}
    {{#rsvp}}<a class="btn btn-small mt-4 mr-5" href="{{rsvp}}">Confirmar presença</a>{{/rsvp}}
    {{#instagram}}<a class="ghost mt-4 text-sm" href="{{instagram}}">Ver no Instagram <span aria-hidden="true">→</span></a>{{/instagram}}
  </div>
</article>
