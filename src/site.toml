# ============================================================================
# SITE SETTINGS.
#
# Links and settings live here, and every page in both languages picks them up
# automatically. Events and the board live in a Google Sheet (see the end of this file). You can edit this file right on
# github.com: the site rebuilds itself a minute or two after you save. See README.md.
#
# Rules: keep the quotes around values. Lines starting with # are notes.
# ============================================================================


# ---------------------------------------------------------------------------
# LINKS
# Replace each "TODO" with the real value. While a value is "TODO", its button
# does nothing and the build prints a warning.
# ---------------------------------------------------------------------------
[links]

# Google Form: prospective/admitted students ask to talk to a student (Prospective)
INTRO_REQUEST_FORM_URL = "TODO"

# Google Form: alumni join the network (Alumni)
ALUMNI_FORM_URL = "TODO"

# Instagram profile link (Contact, footer)
INSTAGRAM_URL = "https://www.instagram.com/brasa.uiuc/"

# Chapter email address, without "mailto:" (Contact, footer)
CONTACT_EMAIL = "uiuc@brasalocal.org"


# ---------------------------------------------------------------------------
# DOMAIN
# The real domain, without https://, for example "example.org".
# Setting it here is not enough on its own: see "Custom domain" in README.md.
# ---------------------------------------------------------------------------
[site]
DOMAIN = "DOMAIN_PLACEHOLDER"


# ---------------------------------------------------------------------------
# HERO IMAGE DESCRIPTION (Home page), read aloud by screen readers.
# Update both if you swap the image.
# ---------------------------------------------------------------------------
[hero]
alt = "Bronze statue of a robed woman with outstretched arms, flanked by two figures, against blurred green trees."
alt_pt = "Estátua de bronze de uma mulher de túnica com os braços abertos, ao lado de duas figuras, contra árvores verdes desfocadas."


# ---------------------------------------------------------------------------
# EVENTS AND BOARD come from the "Website Data" Google Sheet, not from this file:
# https://docs.google.com/spreadsheets/d/1qxJdhrN59IcJeYRflSpPxivYRztom4ReyoHbCc2xX64
# Only change these values if the sheet itself is replaced. Each gid is the
# number after "gid=" in the address bar when that tab is open.
# ---------------------------------------------------------------------------
[sheet]
id = "1qxJdhrN59IcJeYRflSpPxivYRztom4ReyoHbCc2xX64"
events_gid = "0"
board_gid = "2118659172"
