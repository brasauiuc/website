# Builds the site and publishes it to GitHub Pages on every push to main, and once a day.
# One-time setup: repo Settings > Pages > Source > "GitHub Actions". See README.md.
name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Picks up Google Sheet edits and moves finished events to "past", shortly after midnight on
  # campus. GitHub pauses schedules on public repos after 60 days without activity (see README.md).
  schedule:
    - cron: "15 7 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      # python3 comes with the runner. build.py downloads the pinned Tailwind and checks its checksum.
      - name: Build
        run: python3 build.py --base-path "$BASE_PATH" --site-url "$SITE_URL"
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
          SITE_URL: ${{ steps.pages.outputs.base_url }}
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
